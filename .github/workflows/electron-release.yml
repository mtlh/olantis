name: Desktop release

on:
  push:
    branches:
      - master
    # The desktop app is a thin shell around the deployed site, so a web-only
    # change ships through Vercel and needs no new installer. Skip the whole
    # workflow unless something that ends up in the packaged app changed.
    paths:
      - ".github/workflows/electron-release.yml"
      - "electron/**"
      - "public/brand/**"
      - "scripts/electron-dev.mjs"
      - "scripts/run-electron-builder.mjs"
      - "scripts/verify-electron-update-manifest.mjs"
      - "package.json"
      - "package-lock.json"
  # Manual escape hatch for rebuilding installers from an unchanged master.
  workflow_dispatch:

permissions:
  contents: write

# Installers go straight onto the GitHub Release. Release assets are free and
# unlimited, while Actions artifacts count against the repo's storage quota
# (500 MB on the free plan — one Electron build set is already bigger than that).

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Olantis Desktop ${{ github.run_number }}" \
            --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp desktop version
        shell: bash
        run: |
          version="0.1.${{ github.run_number }}"
          npm pkg set "version=$version"
          npm --prefix electron pkg set "version=$version"
          echo "Building Olantis desktop $version"
      - run: npm run electron:dist
      - name: Attach installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-${{ github.run_number }}-${{ github.sha }}
        run: |
          shopt -s nullglob
          # Only distributables and update metadata — never the unpacked app dirs.
          files=(
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No distributables found in release/" >&2
            ls -la release || true
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
