name: CI

on:
  pull_request:
  push:
    branches: [master]

# A follow-up push makes the previous PR run pointless, so cancel it instead of
# queueing work nobody reads. Master runs keep their history: they are the
# record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Timings below are from run 43739398128, the last one before this file changed.
# `npm ci` was 59 of the old job's 118 seconds, almost all of it the audit and
# funding round-trips nobody reads here. The caches the tool chain already writes
# — ESLint's per-file results and the compiled modules `next build` reuses — were
# thrown away after every run.
#
# Caching those takes the job under a minute, which is why the checks and the
# build stay in one job: a second runner would spend more on its own checkout and
# install than the parallelism could win back, and this is a private repo where
# each runner-minute is billed.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Reinstalling the tree costs ~10s and restoring it ~3s. A cached tree can
      # only go bad if it was corrupted while saving: delete the entry in
      # Actions → Caches and the next run installs from scratch.
      - name: Restore node_modules
        id: node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      # One entry for both caches the tool chain keeps in .next/cache:
      # ESLint's per-file results (`npm run lint` is configured to cache there)
      # and the modules Next.js reuses instead of recompiling.
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs', 'public/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
