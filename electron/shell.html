<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:;"
    />
    <title>Olantis</title>
    <link rel="stylesheet" href="shell.css" />
    <script src="shell.js" defer></script>
  </head>
  <body>
    <header class="titlebar" aria-label="Olantis desktop controls">
      <div class="brand">
        <img id="brand-icon" alt="" />
        <span class="brand-name">Olantis</span>
      </div>

      <div class="window-controls" aria-label="Window controls">
        <button class="window-button" id="minimize-button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button class="window-button" id="maximize-button" aria-label="Maximize" title="Maximize">
          <svg class="maximize-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.25" y="2.25" width="7.5" height="7.5" rx=".5" /></svg>
        </button>
        <button class="window-button close-button" id="close-button" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6m0-6L3 9" /></svg>
        </button>
      </div>
    </header>
  </body>
</html>
